<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TypeSmooth - Free online typing speed test. Practice typing with screen mode and paper mode. Track your WPM, accuracy, and progress over time." />
    <meta name="theme-color" content="#03045E" />
    <title>TypeSmooth - Free Typing Speed Test</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='40' width='80' height='45' rx='8' fill='%2303045E'/><rect x='20' y='50' width='10' height='10' rx='2' fill='%23B8FB3C'/><rect x='35' y='50' width='10' height='10' rx='2' fill='%23B8FB3C'/><rect x='50' y='50' width='10' height='10' rx='2' fill='%23B8FB3C'/><rect x='65' y='50' width='10' height='10' rx='2' fill='%23B8FB3C'/><rect x='25' y='65' width='45' height='8' rx='2' fill='%23B8FB3C'/><path d='M 20 30 Q 35 20, 50 30 T 80 30' stroke='%23B8FB3C' stroke-width='4' fill='none' stroke-linecap='round'/></svg>" />
    
    <!-- GitHub Pages SPA Redirect Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Theme initialization - prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('typesmooth_theme') || 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #03045E !important;
        color: #FFFFFF;
      }
      html.light, html.light body {
        background-color: #F8F9FA !important;
        color: #03045E;
      }
      /* Loading state */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      html.dark #root:empty {
        background: linear-gradient(135deg, #03045E, #0A0B2E, #03045E);
      }
      html.light #root:empty {
        background: linear-gradient(135deg, #F8F9FA, #E9ECEF, #F8F9FA);
      }
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(184, 251, 60, 0.3);
        border-top-color: #B8FB3C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
